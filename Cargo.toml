[package]
name = "RustyTools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustytools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pnet = "0.35"
surge-ping = "0.8"
tokio = { version = "1", features = ["full"] }
colored = "2"
rand = "0.8"
sysinfo = "0.30"
