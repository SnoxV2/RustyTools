[package]
name = "rustytools"
version = "0.1.0"
edition = "2021"
description = "Outil de diagnostic réseau pour administrateurs (ping, traceroute, configuration réseau)"
license = "MIT"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
ab_glyph = "0.2"
chrono = "0.4"
netdev = "0.31"
gethostname = "0.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
dns-lookup = "2"
hickory-resolver = "0.24"
mac_oui = { version = "0.4", features = ["with-db"] }

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
winping = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
