# Checks that the project builds and its tests pass on every OS at each push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false # one OS failing does not cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux needs the GUI libraries listed in the README.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
          # The ICMP tests need unprivileged ping sockets, which the runner
          # disables by default (see "ICMP privileges" in the README).
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
